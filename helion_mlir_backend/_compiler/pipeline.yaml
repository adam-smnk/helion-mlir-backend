# The default MLIR optimizing pipeline.
Pipeline:
  # Cleanup freshly imported IR.
  - pass: symbol-dce
  - pass: cse
  - pass: canonicalize

  # Based on Lighthouse's x86 pipeline.
  # Skips packing as the entry-level IR from Helion already contains parallel loops.
  ## Pack and unpack ops the kernel has (e.g. from inline MLIR): tile, lower, vectorize.
  - schedule: "x86/pack_lowering.py[gen=lower_packs_unpacks]{tile_size=32}"
  - include: cleanup.yaml

  ## Initial elementwise operations fusion to group them.
  - pass: "linalg-fuse-elementwise-ops"

  ## 1) CPU cache-level tiling - improves data locality and exposes parallelism.
  - include: x86_64/tile-and-fuse.yaml {
                                  strategy=cache
                                  propagate=True
                                  use_forall=True
                                }
  - include: cleanup.yaml
  # Simplify shapes.
  - schedule: "linalg.py[gen=linalg_contract_fold_unit_dims]"
  - include: cleanup.yaml

  ## Remap iteration space of parallel loops for communication avoidance.
  - schedule: "sfc.py[gen=remap]"

  ## Normalize ops to category.
  - pass: "linalg-categorize-ops"

  ## 2) CPU register-level tiling - ensure data fits in registers.
  ## Parallel register tiles: assign/propagate from contraction anchors and fuse.
  - include: x86_64/tile-and-fuse.yaml {
                                  strategy=register_parallel
                                  propagate=True
                                  use_forall=False
                                }
  - include: cleanup.yaml

  ## Reduction register tiles: annotate K-like dims and tile ops individually.
  - include: x86_64/tile.yaml {
                          strategy=register_reduction
                          propagate=False
                          use_forall=False
                        }
  - include: cleanup.yaml

  ## 3) CPU register-level unrolling via tiling - ensure hardware-friendly shapes.
  - include: x86_64/unroll-register.yaml
  - include: cleanup.yaml

  ## Pads as vector reads of their source: no padded temporary to bufferize.
  - schedule: "helion_transforms.py[gen=vectorize_pads]"
  - include: x86_64/vectorize.yaml

  ## x86_64/lower.yaml, plus the vector.multi_reduction lowering that
  ## convert-vector-to-llvm no longer includes (reductions fail to JIT without it).
  - include: bufferization.yaml
  - include: bufferization-cleanup.yaml
  # Before OpenMP: the split's slow path needs an allocation scope around the transfer.
  - schedule: "helion_transforms.py[gen=split_transfers]"
  - schedule: "omp.py[gen=parallelize]"
  - schedule: "x86/amx_move_offsets.py[gen=amx_move_offsets]"
  - schedule: "vectorization.py[gen=x86_vectorization]"
  - schedule: "vectorization.py[gen=vectorize_all]"
  - schedule: "vectorization.py[gen=flatten_vector_ops]"
  - pass: "func.func(lower-vector-multi-reduction)"
  - include: llvm-lowering.yaml
